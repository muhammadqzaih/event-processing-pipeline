services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: webhook-sqlserver
    ports:
      - "1433:1433"
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${SA_PASSWORD}
    volumes:
      - sqlserver-data:/var/opt/mssql
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: webhook-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build
    container_name: webhook-migrate
    env_file:
      - .env
    command: npm run prisma:push
    depends_on:
      sqlserver:
        condition: service_started
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: api
    container_name: webhook-api
    env_file:
      - .env
    command: npm run start
    ports:
      - "3000:3000"
    depends_on:
      sqlserver:
        condition: service_started
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    container_name: webhook-worker
    env_file:
      - .env
    command: npm run worker
    depends_on:
      sqlserver:
        condition: service_started
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sqlserver-data:
  redis-data:
